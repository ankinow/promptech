name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q overlay
      - name: Check shell scripts
        run: |
          set -eu
          for file in scripts/dictate-*.sh scripts/promptech-logs; do
            bash -n "$file"
          done
